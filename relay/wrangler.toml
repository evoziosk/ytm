name = "ytm-listen-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[durable_objects]
bindings = [{ name = "ROOM", class_name = "Room" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# Point forks to their own Releases page before deploying.
RELEASES_URL = "https://github.com/evoziosk/ytm/releases/latest"

[observability]
enabled = false
