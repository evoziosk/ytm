[workspace]
members = ["crates/protocol", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.3.3"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ytm-protocol = { path = "crates/protocol" }

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "s"
