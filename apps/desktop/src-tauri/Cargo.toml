[package]
name = "ytm-listen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "ytm-listen"

[lib]
name = "ytm_listen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
ytm-protocol.workspace = true
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "net"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
discord-rich-presence = "1.1"
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
rand = "0.9"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }

[target.'cfg(target_os = "linux")'.dependencies]
# deep-link 2.6.2 uses the two-field ParseOption API; 0.21.2+ added required fields.
rust-ini = "=0.21.1"
